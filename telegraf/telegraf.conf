# Telegraf config - System metrics -> InfluxDB v2
# Windows Docker Desktop compatible version

[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000

# ---- INPUT: CPU metrics ----
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false

# ---- INPUT: Memory metrics ----
[[inputs.mem]]

# ---- INPUT: Disk space metrics ----
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# ---- INPUT: Disk I/O metrics ----
[[inputs.diskio]]

# ---- INPUT: Process metrics ----
[[inputs.processes]]

# ---- INPUT: System metrics ----
[[inputs.system]]

# ---- INPUT: Network metrics ----
[[inputs.netstat]]

# ---- INPUT: Swap memory ----
[[inputs.swap]]

# ---- OUTPUT: InfluxDB v2 ----
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${TELEGRAF_BUCKET}"
  timeout = "5s"
